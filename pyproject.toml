[project]
name = "gridshield-lab"
version = "0.2.0"
description = "Local, observe-only synthetic electrical grid laboratory"
requires-python = ">=3.11"
dependencies = ["pandapower==3.5.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
